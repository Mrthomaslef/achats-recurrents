<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Achats récurrents">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>Achats récurrents · Amazon</title>
<style>
  :root {
    --bg:#fbf8f4; --card:#ffffff; --ink:#1c1b19; --mut:#77716a; --soft:#a39c94; --line:#ece6de;
    --acc:#f07c00; --acc-soft:#fff1e2; --acc-ink:#a24f00;
    --ok:#15803d; --ok-soft:#e7f6ec; --ko:#c62828; --ko-soft:#fdecec;
    --shadow:0 1px 2px rgba(40,30,20,.05), 0 4px 14px rgba(40,30,20,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16130f; --card:#211d18; --ink:#f3eee8; --mut:#a8a097; --soft:#7a7269; --line:#332d26;
      --acc:#ff9a2e; --acc-soft:#3a2714; --acc-ink:#ffb768; --ok:#4ade80; --ok-soft:#14301f; --ko:#f87171; --ko-soft:#3a1717; --shadow:none; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); overflow-x:hidden;
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  button, input, label, a, summary { touch-action:manipulation; font:inherit; color:inherit; }
  @media (hover:none) and (pointer:coarse) { #scroller { overscroll-behavior-y:contain; } }
  #scroller { max-width:640px; margin:0 auto; padding:0 16px calc(env(safe-area-inset-bottom) + 48px); }

  /* En-tête */
  .top { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    margin:0 -16px; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:12px; border-bottom:1px solid transparent; }
  .top.scrolled { border-bottom-color:var(--line); }
  .top img { width:40px; height:40px; border-radius:11px; flex:none; }
  .top h1 { font-size:19px; line-height:1.15; margin:0; letter-spacing:-.01em; }
  .top p { margin:0; color:var(--mut); font-size:12.5px; }
  #sync { margin-left:auto; font-size:12px; color:var(--mut); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #sync i { width:8px; height:8px; border-radius:50%; background:var(--soft); display:inline-block; }
  #sync.ok i { background:var(--ok); } #sync.busy i { background:var(--acc); } #sync.err i { background:var(--ko); }

  /* Résumé */
  .hero { margin:14px 0 6px; padding:18px; border-radius:20px; color:#fff; background:linear-gradient(140deg,#ffab40 0%,#f07c00 55%,#d96400 100%); box-shadow:0 10px 28px rgba(240,124,0,.28); }
  .hero.today { background:linear-gradient(140deg,#ff8f3a 0%,#e8590c 60%,#c2410c 100%); }
  .hero .k { font-size:13px; opacity:.9; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  .hero .big { font-size:24px; font-weight:750; line-height:1.2; margin:4px 0 2px; letter-spacing:-.01em; }
  .hero .sub { font-size:14.5px; opacity:.95; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .stats div { background:rgba(255,255,255,.17); border-radius:12px; padding:8px 10px; min-width:0; }
  .stats b { display:block; font-size:18px; line-height:1.2; }
  .stats span { font-size:11.5px; opacity:.92; }
  .alert { margin:12px 0 0; padding:12px 14px; border-radius:14px; background:var(--ko-soft); color:var(--ko); font-size:14px; }
  .alert b { display:block; margin-bottom:2px; }

  /* Sections & frise */
  h2 { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:26px 2px 10px; display:flex; justify-content:space-between; }
  h2 small { font-weight:500; text-transform:none; letter-spacing:0; color:var(--soft); }
  .day { display:flex; align-items:baseline; gap:8px; margin:16px 2px 8px; font-size:15px; font-weight:650; }
  .day .when { font-size:12px; font-weight:600; color:var(--acc-ink); background:var(--acc-soft); padding:2px 8px; border-radius:999px; }
  .day.is-today .when { background:var(--acc); color:#fff; }

  /* Carte article */
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; margin-bottom:10px; box-shadow:var(--shadow); overflow:hidden; }
  .card.off { opacity:.62; }
  .card.ko { border-color:color-mix(in srgb, var(--ko) 45%, var(--line)); }
  .row { display:grid; grid-template-columns:60px 1fr auto; gap:12px; align-items:center; padding:12px 12px 12px 12px; }
  .thumb { width:60px; height:60px; border-radius:12px; background:#fff; object-fit:contain; padding:4px; border:1px solid var(--line); }
  .info { min-width:0; }
  .name { font-weight:650; font-size:16px; line-height:1.25; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .line { margin-top:4px; font-size:13.5px; color:var(--mut); display:flex; flex-wrap:wrap; gap:4px 10px; }
  .line b { color:var(--ink); font-weight:650; }
  .tag { font-size:12px; font-weight:650; border-radius:999px; padding:1px 8px; }
  .tag.ko { background:var(--ko-soft); color:var(--ko); }
  .tag.low { background:var(--acc-soft); color:var(--acc-ink); }

  /* Interrupteur (une seule action : commander ou non) */
  .sw { position:relative; width:52px; height:32px; flex:none; }
  .sw input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; }
  .sw span { position:absolute; inset:0; border-radius:999px; background:var(--line); transition:.2s; }
  .sw span::after { content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:.2s; }
  .sw input:checked + span { background:var(--ok); }
  .sw input:checked + span::after { transform:translateX(20px); }

  /* Réglages repliés */
  details { border-top:1px solid var(--line); }
  summary { list-style:none; cursor:pointer; padding:10px 14px; font-size:13.5px; color:var(--mut); display:flex; justify-content:space-between; align-items:center; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"›"; font-size:20px; line-height:1; transition:.2s; color:var(--soft); }
  details[open] summary::after { transform:rotate(90deg); }
  .edit { padding:2px 14px 14px; }
  .fields { display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:10px; }
  .fields label { font-size:12px; color:var(--mut); font-weight:600; min-width:0; }
  .fields input { display:block; width:100%; min-width:0; margin-top:4px; font-size:16px; padding:9px 10px; border:1px solid var(--line); border-radius:11px; background:var(--bg); color:var(--ink); -webkit-appearance:none; appearance:none; min-height:42px; }
  .fields input:focus { outline:2px solid var(--acc); outline-offset:-1px; }
  .fulltitle { font-size:12.5px; color:var(--mut); margin:12px 0 8px; line-height:1.35; }
  .foot { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; color:var(--mut); }
  .foot a { color:var(--acc-ink); font-weight:650; text-decoration:none; white-space:nowrap; }

  /* Historique */
  .log { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:2px 14px; box-shadow:var(--shadow); }
  .log div { padding:11px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; font-size:14px; }
  .log div:last-child { border-bottom:0; }
  .log span:last-child { color:var(--mut); white-space:nowrap; }
  .empty { color:var(--mut); text-align:center; padding:14px 0 !important; justify-content:center !important; }

  .help { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-top:26px; font-size:13.5px; color:var(--mut); }
  .help ol { margin:6px 0 0; padding-left:18px; } .help li { margin:4px 0; } .help b { color:var(--ink); }

  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 28px); transform:translateX(-50%) translateY(30px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; opacity:0; transition:.25s; pointer-events:none; z-index:10; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #ptr { position:fixed; top:calc(env(safe-area-inset-top) + 64px); left:50%; width:34px; height:34px; margin-left:-17px; border-radius:50%; background:var(--card); box-shadow:0 2px 10px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; opacity:0; z-index:20; pointer-events:none; }
  #ptr svg { width:20px; height:20px; color:var(--acc); }
  #ptr.spin svg { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #lock { display:none; text-align:center; padding:48px 12px; color:var(--mut); }
  #lock input { font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); width:100%; max-width:320px; margin:12px 0; }
  #lock button { background:var(--acc); color:#fff; border:0; border-radius:12px; padding:12px 22px; font-weight:650; }
</style>
</head>
<body>
<div id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></div>
<div id="scroller">
  <div class="top" id="top">
    <img src="assets/icon.svg" alt="">
    <div><h1>Achats récurrents</h1><p>Amazon · compte de Marie</p></div>
    <span id="sync"><i></i><span>…</span></span>
  </div>
  <div id="lock">
    <p>Ouvre l'app depuis le lien reçu par iMessage,<br>ou colle ici le code d'accès.</p>
    <input id="code" placeholder="Code d'accès" autocomplete="off" autocapitalize="off">
    <br><button id="unlock">Ouvrir</button>
  </div>
  <div id="app"></div>
</div>
<div id="toast"></div>
<script src="data/vault.js"></script>
<script src="data/embedded_data.js"></script>
<script>
const REPO_API = "https://api.github.com/repos/Mrthomaslef/amazon-recurrent-state/contents/state.json";
const LS_KEY = "amzrec_key_v1", LS_STATE = "amzrec_state_v1";
let token = null, state = null, pending = {}, saveTimer = null, openSet = new Set();

const $ = (s) => document.querySelector(s);
const b64d = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const b64e = (u8) => { let s = ""; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
async function aesKey(code) { const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(code.trim())); return crypto.subtle.importKey("raw", h, "AES-GCM", false, ["decrypt"]); }
async function decrypt(code, box) { const k = await aesKey(code); const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(box.iv) }, k, b64d(box.ct)); return new TextDecoder().decode(pt); }
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 1800); }
function setSync(cls, txt) { const s = $("#sync"); s.className = cls; s.lastElementChild.textContent = txt; }
const todayStr = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Paris" });
const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 864e5);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const fr = (d, o = { weekday: "long", day: "numeric", month: "long" }) => d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR", o) : "—";
const frShort = (d) => fr(d, { day: "numeric", month: "short" });
const eur = (n) => n == null ? "" : n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const imgUrl = (u) => { const m = String(u || "").match(/\/images\/I\/([A-Za-z0-9+%_-]+?)\./); return m ? `https://m.media-amazon.com/images/I/${encodeURIComponent(decodeURIComponent(m[1]))}._AC_SL300_.jpg` : "assets/icon.svg"; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const every = (n) => n % 7 === 0 && n <= 56 ? (n === 7 ? "toutes les semaines" : `toutes les ${n / 7} semaines`) : n >= 28 && n <= 33 ? "tous les mois" : `tous les ${n} jours`;
function relDay(d, today) {
  const n = daysBetween(today, d);
  return n <= 0 ? "aujourd'hui" : n === 1 ? "demain" : n < 7 ? `dans ${n} jours` : n < 14 ? "dans 1 semaine" : n < 45 ? `dans ${Math.round(n / 7)} semaines` : `dans ${Math.round(n / 30)} mois`;
}

async function unlock(code) {
  try {
    token = await decrypt(code, window.AMZ_VAULT);
    localStorage.setItem(LS_KEY, code.trim());
    if (window.AMZ_ENC && !localStorage.getItem(LS_STATE)) { try { localStorage.setItem(LS_STATE, await decrypt(code, window.AMZ_ENC)); } catch (e) {} }
    $("#lock").style.display = "none";
    return true;
  } catch (e) { $("#lock").style.display = "block"; return false; }
}

async function fetchState() {
  const r = await fetch(REPO_API + "?t=" + Date.now(), { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" }, cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  return { sha: j.sha, st: JSON.parse(new TextDecoder().decode(b64d(j.content.replace(/\n/g, "")))) };
}

async function load() {
  setSync("busy", "Synchro…");
  try {
    const { st } = await fetchState();
    for (const [asin, c] of Object.entries(pending)) { const it = st.items.find(x => x.asin === asin); if (it) Object.assign(it, c); }
    state = st; localStorage.setItem(LS_STATE, JSON.stringify(state));
    setSync("ok", "À jour");
  } catch (e) {
    state = state || JSON.parse(localStorage.getItem(LS_STATE) || "null");
    setSync("err", "Hors ligne");
  }
  render();
}

function patch(asin, changes, rerender = true) {
  pending[asin] = { ...(pending[asin] || {}), ...changes };
  Object.assign(state.items.find(i => i.asin === asin), changes);
  if (rerender) render();
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 500);
}

async function save() {
  const ch = pending; pending = {};
  if (!Object.keys(ch).length) return;
  setSync("busy", "Enregistrement…");
  for (let i = 0; i < 4; i++) {
    try {
      const { sha, st: fresh } = await fetchState(); // relit pour ne jamais écraser une mise à jour du Mac
      for (const [asin, c] of Object.entries(ch)) { const it = fresh.items.find(x => x.asin === asin); if (it) Object.assign(it, c); }
      fresh.updated = new Date().toISOString();
      const body = { message: "app : " + Object.keys(ch).length + " modification(s)", sha, content: b64e(new TextEncoder().encode(JSON.stringify(fresh, null, 1))) };
      const w = await fetch(REPO_API, { method: "PUT", headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" }, body: JSON.stringify(body) });
      if (w.status === 409 || w.status === 422) continue;
      if (!w.ok) throw new Error(w.status);
      state = fresh; localStorage.setItem(LS_STATE, JSON.stringify(state));
      setSync("ok", "Enregistré"); toast("Enregistré ✓"); render();
      return;
    } catch (e) { if (i === 3) break; }
  }
  pending = { ...ch, ...pending };
  setSync("err", "Non enregistré"); toast("Pas de réseau — réessaie");
}

function card(it, today) {
  const due = it.checked && it.next <= today;
  const ko = it.status === "rupture" || it.status === "erreur";
  const low = /reste plus que/i.test(it.availability || "");
  const when = !it.checked ? "En pause" : due ? "Commandé à 12h" : every(it.interval);
  const tags = ko ? `<span class="tag ko">${it.status === "rupture" ? "Rupture de stock" : esc(it.lastError || "Erreur")}</span>` : low ? `<span class="tag low">Stock limité</span>` : "";
  return `<div class="card ${it.checked ? "" : "off"} ${ko ? "ko" : ""}">
    <div class="row">
      <img class="thumb" src="${esc(imgUrl(it.image))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='assets/icon.svg'">
      <div class="info">
        <div class="name">${esc(it.short || it.title)}</div>
        <div class="line"><b>${it.price ? eur(it.price * (it.qty || 1)) : "—"}</b>${it.qty > 1 ? `<span>×${it.qty}</span>` : ""}<span>${when}</span>${tags}</div>
      </div>
      <label class="sw" title="Commander automatiquement"><input type="checkbox" class="chk" data-a="${it.asin}" ${it.checked ? "checked" : ""} aria-label="Commander automatiquement ${esc(it.short)}"><span></span></label>
    </div>
    <details data-a="${it.asin}" ${openSet.has(it.asin) ? "open" : ""}>
      <summary>Régler la date, la fréquence, la quantité</summary>
      <div class="edit">
        <div class="fields">
          <label>Prochaine<input type="date" value="${it.next}" min="${today}" data-a="${it.asin}" data-f="next"></label>
          <label>Tous les (j)<input type="number" inputmode="numeric" min="3" max="400" value="${it.interval}" data-a="${it.asin}" data-f="interval"></label>
          <label>Quantité<input type="number" inputmode="numeric" min="1" max="10" value="${it.qty || 1}" data-a="${it.asin}" data-f="qty"></label>
        </div>
        <div class="fulltitle">${esc(it.title)}</div>
        <div class="foot"><span>${it.count && it.last ? `Acheté ${it.count} fois · dernière fois le ${frShort(it.last)}` : "Jamais encore commandé"}</span><a href="https://www.amazon.fr/dp/${it.asin}" target="_blank" rel="noopener">Fiche Amazon ↗</a></div>
      </div>
    </details>
  </div>`;
}

function render() {
  if (!state) { $("#app").innerHTML = `<p class="empty">Chargement…</p>`; return; }
  const today = todayStr();
  const items = [...state.items].sort((a, b) => a.next.localeCompare(b.next) || (a.short || "").localeCompare(b.short || ""));
  const on = items.filter(i => i.checked), off = items.filter(i => !i.checked);
  const due = on.filter(i => i.next <= today);
  const monthly = on.reduce((t, i) => t + (i.price || 0) * (i.qty || 1) * 30 / Math.max(3, i.interval), 0);
  const in30 = on.filter(i => daysBetween(today, i.next) <= 30).reduce((t, i) => t + (i.price || 0) * (i.qty || 1), 0);
  const rupt = on.filter(i => i.status === "rupture");
  let h = "";
  if (due.length) {
    const tot = due.reduce((t, i) => t + (i.price || 0) * (i.qty || 1), 0);
    h += `<div class="hero today"><div class="k">Aujourd'hui</div><div class="big">${due.length} article${due.length > 1 ? "s" : ""} commandé${due.length > 1 ? "s" : ""} à 12h</div>
      <div class="sub">≈ ${eur(tot)} · coupe l'interrupteur avant midi pour annuler</div></div>`;
  } else {
    const nx = on[0];
    h += `<div class="hero"><div class="k">Prochaine commande</div>
      <div class="big">${nx ? cap(fr(nx.next)) : "Aucune"}</div>
      <div class="sub">${nx ? esc(nx.short) + " · " + relDay(nx.next, today) : "Active un article pour démarrer"}</div>
      <div class="stats"><div><b>${on.length}</b><span>actifs</span></div><div><b>${eur(in30).replace(/,\d\d/, "")}</b><span>sur 30 jours</span></div><div><b>${eur(monthly).replace(/,\d\d/, "")}</b><span>par mois</span></div></div></div>`;
  }
  if (rupt.length) h += `<div class="alert"><b>⚠️ Rupture de stock</b>${rupt.map(i => esc(i.short)).join(", ")} — rien n'est commandé tant que ce n'est pas revenu. Tu seras prévenue.</div>`;

  // Frise par date
  h += `<h2>À venir <small>${on.length} article${on.length > 1 ? "s" : ""}</small></h2>`;
  let lastDay = null;
  for (const it of on) {
    const d = it.next <= today ? today : it.next;
    if (d !== lastDay) {
      lastDay = d;
      h += `<div class="day ${d === today ? "is-today" : ""}">${cap(fr(d))} <span class="when">${relDay(d, today)}</span></div>`;
    }
    h += card(it, today);
  }
  if (off.length) h += `<h2>En pause <small>${off.length}</small></h2>` + off.map(i => card(i, today)).join("");
  const log = (state.log || []).slice(0, 12);
  h += `<h2>Commandes passées</h2><div class="log">${log.length ? log.map(l => `<div><span>${esc(l.title)}${l.qty > 1 ? " ×" + l.qty : ""}</span><span>${frShort(l.date)}${l.total ? " · " + eur(l.total) : ""}</span></div>`).join("") : `<div class="empty">Aucune commande automatique pour l'instant</div>`}</div>`;
  h += `<div class="help"><b>Comment ça marche</b><ol>
    <li>Interrupteur <b>vert</b> : l'article est commandé automatiquement à sa date (même référence, adresse et carte habituelles).</li>
    <li>Le matin même, un <b>iMessage</b> récapitule la commande de midi.</li>
    <li>Pour annuler, <b>coupe l'interrupteur avant 12h</b> — l'article reste en pause jusqu'à ce que tu le réactives.</li>
    <li>Touche la ligne grise d'un article pour changer sa <b>date</b>, sa <b>fréquence</b> ou la <b>quantité</b>.</li>
    <li>En cas de <b>rupture de stock</b>, rien n'est commandé et tu es prévenue.</li></ol></div>`;
  $("#app").innerHTML = h;
}

document.addEventListener("change", (e) => {
  const t = e.target, a = t.dataset.a; if (!a) return;
  if (t.classList.contains("chk")) { navigator.vibrate && navigator.vibrate(8); return patch(a, { checked: t.checked }); }
  const f = t.dataset.f;
  if (f === "next" && t.value) return patch(a, { next: t.value < todayStr() ? todayStr() : t.value });
  if (f === "interval") return patch(a, { interval: Math.max(3, Math.min(400, parseInt(t.value) || 30)) });
  if (f === "qty") return patch(a, { qty: Math.max(1, Math.min(10, parseInt(t.value) || 1)) });
});
document.addEventListener("toggle", (e) => { const d = e.target; if (d.tagName === "DETAILS") d.open ? openSet.add(d.dataset.a) : openSet.delete(d.dataset.a); }, true);
addEventListener("scroll", () => $("#top").classList.toggle("scrolled", scrollY > 4), { passive: true });

/* Pull-to-refresh (tactile + souris) — flèche circulaire seule */
(function () {
  const ptr = $("#ptr"); let y0 = null, dy = 0;
  const start = (y) => { if (window.scrollY <= 0) { y0 = y; dy = 0; } };
  const move = (y) => { if (y0 == null) return; dy = Math.max(0, Math.min(110, y - y0)); ptr.style.opacity = Math.min(1, dy / 70); ptr.style.transform = `translateY(${dy / 2}px) rotate(${dy * 3}deg)`; };
  const end = async () => {
    if (y0 == null) return; y0 = null;
    if (dy > 70) { ptr.classList.add("spin"); navigator.vibrate && navigator.vibrate(12); await load(); }
    ptr.classList.remove("spin"); ptr.style.opacity = 0; ptr.style.transform = ""; dy = 0;
  };
  addEventListener("touchstart", e => start(e.touches[0].clientY), { passive: true });
  addEventListener("touchmove", e => move(e.touches[0].clientY), { passive: true });
  addEventListener("touchend", end);
  addEventListener("mousedown", e => { if (e.target.closest("input,a,button,label,summary")) return; start(e.clientY); });
  addEventListener("mousemove", e => { if (e.buttons) move(e.clientY); });
  addEventListener("mouseup", end);
})();

$("#unlock").onclick = async () => { if (await unlock($("#code").value)) load(); else toast("Code incorrect"); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && token && !Object.keys(pending).length) load(); });

(async () => {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const m = location.hash.match(/k=([\w-]+)/);
  if (m) history.replaceState(null, "", location.pathname);
  const code = (m && m[1]) || localStorage.getItem(LS_KEY);
  if (code && await unlock(code)) { state = JSON.parse(localStorage.getItem(LS_STATE) || "null"); render(); load(); }
  else { $("#lock").style.display = "block"; $("#app").innerHTML = ""; }
})();
</script>
